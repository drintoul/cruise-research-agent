services:

  research-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: basic-agentic-research-agent
    restart: unless-stopped
    ports:
      - "${CHAINLIT_PORT}:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000', timeout=5).read(1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  document-ingester:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: basic-agentic-research-ingester
    restart: unless-stopped
    command: ["python", "ingest.py", "--watch"]
    env_file:
      - .env
    volumes:
      - ./documents:/app/documents:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "ingest.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  qdrant:
    image: ${QDRANT_IMAGE}
    container_name: research-qdrant
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - ./qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-researcher-demo
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - research-agent
